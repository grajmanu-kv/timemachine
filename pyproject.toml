[project]
name = "timemachine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
timemachine = "timemachine.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: multi-thousand-seed searches (skip with -m 'not slow')"]